<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shizu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js" defer></script>
  </head>

  <body>
    <header id="toolbar" role="toolbar" aria-label="Formatting toolbar">
      <button id="new-btn" class="tb-btn" type="button" title="New (Ctrl+N)" aria-label="New document">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>
      </button>
      <button id="open-btn" class="tb-btn" type="button" title="Open (Ctrl+O)" aria-label="Open file">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
        </svg>
      </button>
      <button id="save-btn" class="tb-btn" type="button" title="Save (Ctrl+S)" aria-label="Save">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
          <polyline points="17 21 17 13 7 13 7 21" />
          <polyline points="7 3 7 8 15 8" />
        </svg>
      </button>

      <div class="tb-sep"></div>

      <select id="canvas-select" class="tb-select tb-select-sm" title="Page size" aria-label="Page size">
        <option value="fluid">Infinite</option>
        <option value="a4">A4</option>
        <option value="a5">A5</option>
      </select>

      <div class="tb-sep"></div>

      <select id="font-select" class="tb-select" title="Font family" aria-label="Font family">
        <option value="Inter" style="font-family: 'Inter'">Inter</option>
        <option value="Georgia" style="font-family: 'Georgia'">Georgia</option>
        <option value="Noto Sans JP" style="font-family: 'Noto Sans JP'">Noto Sans Japanese</option>
        <option value="Cedarville Cursive" style="font-family: 'Cedarville Cursive'">Cedarville Cursive</option>
      </select>

      <div class="tb-sep"></div>

      <div class="style-group">
        <button id="bold-btn" class="tb-btn tb-toggle" type="button" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false">
          <span style="font-weight: 700; font-size: 14px;">B</span>
        </button>
        <button id="italic-btn" class="tb-btn tb-toggle" type="button" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false">
          <span style="font-style: italic; font-family: Georgia, serif; font-size: 14px;">I</span>
        </button>
        <button id="underline-btn" class="tb-btn tb-toggle" type="button" title="Underline (Ctrl+U)" aria-label="Underline" aria-pressed="false">
          <span style="text-decoration: underline; font-size: 14px;">U</span>
        </button>
      </div>

      <div class="tb-sep"></div>

      <div class="size-group" title="Font size">
        <button id="size-dec" class="tb-btn" type="button" aria-label="Decrease font size">−</button>
        <input id="size-input" type="text" inputmode="numeric" value="18" aria-label="Font size" />
        <button id="size-inc" class="tb-btn" type="button" aria-label="Increase font size">+</button>
      </div>

      <div class="tb-sep"></div>

      <div class="align-group">
        <button id="align-left" class="tb-btn tb-toggle" type="button" title="Align left" aria-label="Align left" aria-pressed="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="13" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <button id="align-center" class="tb-btn tb-toggle" type="button" title="Align center" aria-label="Align center" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="7" y1="12" x2="17" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <button id="align-right" class="tb-btn tb-toggle" type="button" title="Align right" aria-label="Align right" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="11" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
      </div>

      <div class="tb-sep"></div>

      <button
        id="ruled-toggle"
        class="tb-btn tb-toggle"
        type="button"
        aria-pressed="false"
        title="Ruled lines"
        aria-label="Ruled lines"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 6h16M4 11h16M4 16h16M4 21h16" />
        </svg>
      </button>

      <div class="size-group" title="Line height (px)">
        <button id="line-dec" class="tb-btn" type="button" aria-label="Decrease line height">−</button>
        <input id="line-input" type="text" inputmode="numeric" value="23" aria-label="Line height (px)" />
        <button id="line-inc" class="tb-btn" type="button" aria-label="Increase line height">+</button>
      </div>

      <div class="tb-sep"></div>

      <button
        id="vectorize-btn"
        class="tb-btn with-label"
        type="button"
        title="Vectorize"
        aria-label="Vectorize selection"
        disabled
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19l7-7 3 3-7 7-3-3z" />
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
          <path d="M2 2l7.586 7.586" />
          <circle cx="11" cy="11" r="2" />
        </svg>
        <span>Vectorize</span>
      </button>

      <button
        id="readonly-toggle"
        class="tb-btn tb-toggle"
        type="button"
        aria-pressed="false"
        title="Toggle read-only (Caret Lock)"
        aria-label="Toggle read-only (Caret Lock)"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </button>

      <div class="tb-sep"></div>

      <button id="png-btn" class="tb-btn" type="button" title="Export as PNG" aria-label="Export as PNG">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <polyline points="21 15 16 10 5 21" />
        </svg>
      </button>
      <button id="svg-btn" class="tb-btn" type="button" title="Export as SVG" aria-label="Export as SVG">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17c5-10 13-10 18 0" />
          <circle cx="3" cy="17" r="1.5" />
          <circle cx="21" cy="17" r="1.5" />
          <circle cx="12" cy="9.5" r="1.5" />
        </svg>
      </button>

      <div class="tb-spacer"></div>

      <label class="color-field" title="Background color">
        <span class="color-label">Canvas</span>
        <span id="bg-swatch" class="swatch"></span>
        <input id="bg-hex" type="text" value="#FFFFFF" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Background color (hex)" />
      </label>

      <label class="color-field" title="Text color">
        <span class="color-label">Text</span>
        <span id="fg-swatch" class="swatch"></span>
        <input id="fg-hex" type="text" value="#000000" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Text color (hex)" />
      </label>
    </header>

    <input type="file" id="open-file" accept=".shizu" hidden />

    <div id="workspace">
      <div id="page" data-canvas="fluid">
        <svg id="layer-back" class="vlayer" xmlns="http://www.w3.org/2000/svg"></svg>

        <main
          id="editor"
          contenteditable="true"
          spellcheck="false"
          autofocus
          aria-label="Text editor"
        ></main>

        <svg id="layer-front" class="vlayer" xmlns="http://www.w3.org/2000/svg"></svg>
        <svg id="layer-ui" class="vlayer" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
  </body>
</html>
